<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedor · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div class="mb-4"><a th:href="@{/proveedores}" class="text-decoration-none">← Proveedores</a>
        <h1 class="h2 mt-3" th:text="${form.id == null} ? 'Nuevo proveedor' : 'Editar proveedor'">Nuevo proveedor</h1></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <form th:action="@{/proveedores/guardar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-12"><label for="razonSocial" class="form-label">Razón social</label>
                    <input id="razonSocial" class="form-control" th:field="*{razonSocial}" maxlength="120" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div></div>
                <div class="col-md-6"><label for="ruc" class="form-label">RUC</label>
                    <input id="ruc" class="form-control" th:field="*{ruc}" inputmode="numeric" maxlength="11">
                    <div class="text-danger small" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></div></div>
                <div class="col-md-6"><label for="telefono" class="form-label">Teléfono</label>
                    <input id="telefono" class="form-control" th:field="*{telefono}" maxlength="20">
                    <div class="text-danger small" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div></div>
                <div class="col-md-6"><label for="correo" class="form-label">Correo</label>
                    <input id="correo" type="email" class="form-control" th:field="*{correo}" maxlength="120">
                    <div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div></div>
                <div class="col-md-6"><label for="direccion" class="form-label">Dirección</label>
                    <input id="direccion" class="form-control" th:field="*{direccion}" maxlength="200">
                    <div class="text-danger small" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div></div>
            </div>
            <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/proveedores}">Cancelar</a></div>
        </form>
    </div></div>
</main>
</body>
</html>
