<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4" style="width: min(100%, 430px)">
        <div class="card-body p-4 p-md-5">
            <p class="text-primary fw-semibold mb-2">SISTEMA DE INVENTARIO</p>
            <h1 class="h3 mb-2">Iniciar sesión</h1>
            <p class="text-secondary mb-4">Ingresa con tu correo y contraseña.</p>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                No se pudo iniciar sesión. Revisa tus datos o pide al administrador que active tu cuenta.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                Cerraste sesión correctamente.
            </div>
            <div th:if="${param.configured}" class="alert alert-success" role="alert">
                Administrador creado. Ya puedes iniciar sesión.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Correo</label>
                    <input id="username" name="username" type="email" class="form-control form-control-lg"
                           autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" name="password" type="password" class="form-control form-control-lg"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
            </form>
            <p th:if="${configuracionDisponible}" class="text-center mt-4 mb-0">
                <a th:href="@{/configurar-admin}">Configurar el primer administrador</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
