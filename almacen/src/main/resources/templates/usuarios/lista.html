<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div th:replace="~{fragments/alertas :: mensajes}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><p class="text-primary fw-semibold mb-1">ADMINISTRACIÓN</p><h1 class="h2 mb-0">Usuarios</h1></div>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo usuario</a>
    </div>
    <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td class="fw-semibold" th:text="${usuario.nombre}">Usuario</td>
                <td th:text="${usuario.correo}">correo@ejemplo.com</td>
                <td><span class="badge text-bg-primary" th:text="${usuario.rol}">EMPLEADO</span></td>
                <td><span class="badge" th:classappend="${usuario.estado} ? ' text-bg-success' : ' text-bg-secondary'"
                          th:text="${usuario.estado} ? 'Activo' : 'Inactivo'">Activo</span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                    <form class="d-inline" th:action="@{/usuarios/{id}/estado(id=${usuario.id})}" method="post">
                        <button class="btn btn-sm btn-outline-secondary" type="submit"
                                th:text="${usuario.estado} ? 'Desactivar' : 'Activar'">Desactivar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div></div>
    <p class="form-text mt-3">Las contraseñas nunca se muestran; puedes establecer una nueva al editar una cuenta.</p>
</main>
</body>
</html>
