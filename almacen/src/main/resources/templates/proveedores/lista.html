<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div th:replace="~{fragments/alertas :: mensajes}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><p class="text-primary fw-semibold mb-1">CATÁLOGOS</p><h1 class="h2 mb-0">Proveedores</h1></div>
        <a th:if="${esAdmin}" th:href="@{/proveedores/nuevo}" class="btn btn-primary">Nuevo proveedor</a>
    </div>
    <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Razón social</th><th>RUC</th><th>Teléfono</th><th>Correo</th><th th:if="${esAdmin}" class="text-end">Acciones</th></tr></thead>
            <tbody>
            <tr th:each="proveedor : ${proveedores}">
                <td class="fw-semibold" th:text="${proveedor.razonSocial}">Empresa</td>
                <td th:text="${proveedor.ruc ?: '—'}">—</td>
                <td th:text="${proveedor.telefono ?: '—'}">—</td>
                <td th:text="${proveedor.correo ?: '—'}">—</td>
                <td th:if="${esAdmin}" class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/proveedores/{id}/editar(id=${proveedor.id})}">Editar</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(proveedores)}"><td colspan="5" class="text-center text-secondary py-5">Aún no hay proveedores.</td></tr>
            </tbody>
        </table>
    </div></div>
    <p class="form-text mt-3">Los proveedores se conservan para mantener el historial de movimientos.</p>
</main>
</body>
</html>
