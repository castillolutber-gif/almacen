<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div class="mb-4"><a th:href="@{/productos}" class="text-decoration-none">← Productos</a>
        <h1 class="h2 mt-3" th:text="${form.id == null} ? 'Nuevo producto' : 'Editar producto'">Nuevo producto</h1></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <form th:action="@{/productos/guardar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-4"><label for="codigo" class="form-label">Código</label>
                    <input id="codigo" class="form-control" th:field="*{codigo}" maxlength="30" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div></div>
                <div class="col-md-8"><label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" class="form-control" th:field="*{nombre}" maxlength="120" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
                <div class="col-12"><label for="descripcion" class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="2" maxlength="255"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div></div>
                <div class="col-md-4"><label for="precioCompra" class="form-label">Precio de compra (S/)</label>
                    <input id="precioCompra" class="form-control" type="number" step="0.01" min="0" th:field="*{precioCompra}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('precioCompra')}" th:errors="*{precioCompra}"></div></div>
                <div class="col-md-4"><label for="precioVenta" class="form-label">Precio de venta (S/)</label>
                    <input id="precioVenta" class="form-control" type="number" step="0.01" min="0.01" th:field="*{precioVenta}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div></div>
                <div class="col-md-4"><label for="stockMinimo" class="form-label">Stock mínimo</label>
                    <input id="stockMinimo" class="form-control" type="number" min="0" th:field="*{stockMinimo}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div></div>
                <div class="col-12"><label for="categoriaId" class="form-label">Categoría</label>
                    <select id="categoriaId" class="form-select" th:field="*{categoriaId}" required>
                        <option value="">Selecciona una categoría activa</option>
                        <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div></div>
                <div class="col-12 form-check ms-2" th:if="${form.id != null}">
                    <input id="estado" class="form-check-input" type="checkbox" th:field="*{estado}">
                    <label for="estado" class="form-check-label">Producto activo</label>
                </div>
            </div>
            <div class="alert alert-info mt-4 mb-3">El stock inicial se establece en cero. Usa un movimiento de entrada para aumentarlo.</div>
            <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a></div>
        </form>
    </div></div>
</main>
</body>
</html>
