spring.application.name=almacen

# Conexión al servidor MariaDB/MySQL local. Ajusta DB_URL si usas otro puerto.
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/bd_inventario
spring.datasource.username=root
spring.datasource.password=

# Solo valida el esquema existente: nunca crea, modifica ni borra tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
