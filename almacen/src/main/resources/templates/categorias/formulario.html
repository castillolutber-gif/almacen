<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categoría · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div class="mb-4">
        <a th:href="@{/categorias}" class="text-decoration-none">← Categorías</a>
        <h1 class="h2 mt-3" th:text="${form.id == null} ? 'Nueva categoría' : 'Editar categoría'">Nueva categoría</h1>
    </div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <form th:action="@{/categorias/guardar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre</label>
                <input id="nombre" class="form-control" th:field="*{nombre}" maxlength="80" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="descripcion">Descripción</label>
                <textarea id="descripcion" class="form-control" rows="3" th:field="*{descripcion}" maxlength="200"></textarea>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
            </div>
            <div class="form-check mb-4" th:if="${form.id != null}">
                <input id="estado" class="form-check-input" type="checkbox" th:field="*{estado}">
                <label class="form-check-label" for="estado">Categoría activa</label>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/categorias}">Cancelar</a>
            </div>
        </form>
    </div></div>
</main>
</body>
</html>
