<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuario · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: barra}"></div>
<main class="container py-4 py-lg-5">
    <div class="mb-4"><a th:href="@{/usuarios}" class="text-decoration-none">← Usuarios</a>
        <h1 class="h2 mt-3" th:text="${form.id == null} ? 'Nuevo usuario' : 'Editar usuario'">Nuevo usuario</h1></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <form th:action="@{/usuarios/guardar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-6"><label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" class="form-control" th:field="*{nombre}" maxlength="100" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
                <div class="col-md-6"><label for="correo" class="form-label">Correo</label>
                    <input id="correo" type="email" class="form-control" th:field="*{correo}" maxlength="120" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div></div>
                <div class="col-md-6"><label for="rol" class="form-label">Rol</label>
                    <select id="rol" class="form-select" th:field="*{rol}" required>
                        <option value="">Selecciona un rol</option>
                        <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div></div>
                <div class="col-md-6"><label for="password" class="form-label" th:text="${form.id == null} ? 'Contraseña inicial' : 'Nueva contraseña (opcional)'"></label>
                    <input id="password" type="password" class="form-control" th:field="*{password}"
                           minlength="12" autocomplete="new-password" th:required="${form.id == null}">
                    <div class="form-text" th:if="${form.id != null}">Déjala vacía para conservar la contraseña actual.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div>
                <div class="col-12 form-check ms-2" th:if="${form.id != null}">
                    <input id="estado" class="form-check-input" type="checkbox" th:field="*{estado}">
                    <label for="estado" class="form-check-label">Cuenta activa</label>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Guardar</button>
                <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a></div>
        </form>
    </div></div>
</main>
</body>
</html>
