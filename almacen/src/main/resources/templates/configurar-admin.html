<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear administrador · Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card border-0 shadow-sm rounded-4" style="width: min(100%, 500px)">
        <div class="card-body p-4 p-md-5">
            <p class="text-primary fw-semibold mb-2">CONFIGURACIÓN INICIAL</p>
            <h1 class="h3 mb-2">Crear administrador</h1>
            <p class="text-secondary mb-4">Esta pantalla funciona desde este equipo y se cierra cuando exista un administrador con contraseña activa.</p>

            <form th:action="@{/configurar-admin}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input id="nombre" th:field="*{nombre}" class="form-control" maxlength="100" required autofocus>
                    <div class="text-danger small" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input id="correo" th:field="*{correo}" type="email" class="form-control" maxlength="120" autocomplete="username" required>
                    <div class="text-danger small" th:errors="*{correo}"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input id="password" th:field="*{password}" type="password" class="form-control" minlength="12" maxlength="72" autocomplete="new-password" required>
                    <div class="form-text">Usa al menos 12 caracteres.</div>
                    <div class="text-danger small" th:errors="*{password}"></div>
                </div>
                <div class="mb-4">
                    <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
                    <input id="confirmarPassword" th:field="*{confirmarPassword}" type="password" class="form-control" maxlength="72" autocomplete="new-password" required>
                    <div class="text-danger small" th:errors="*{confirmarPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Crear administrador</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
